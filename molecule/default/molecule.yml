---
dependency:
  name: galaxy
  enabled: ${DEPENDENCY_ENABLED:-True}
  options:
    role-file: ${REQUIREMENTS_PATH:-requirements.yml}
    requirements-file: requirements-collections.yml
driver:
  name: podman
platforms:
  - name: routing.osgiliath.test
    image: fedora:44
    # image: ubi9/ubi-init:latest
    dockerfile: ../common/Dockerfile.j2
    # registry:
    #   url: registry.access.redhat.com
    privileged: True
    command: "/sbin/init"
    systemd: True
    # host networking: the scenario exercises the podman machine's kernel and NIC, so the
    # container shares the machine's network namespace (sysctl writes hit the machine,
    # and global keys such as net.netfilter.nf_conntrack_max are writable)
    network: host
    volumes:
      - /lib/modules:/lib/modules:ro
    cgroupns_mode: private
    dns_servers:
      - 8.8.8.8
    env:
      CI: "true"
#    capabilities:
#      - SYS_ADMIN
#      - CAP_SYS_TIME
    # pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
        firewalld_immediate: false
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${HOME}/.ansible/collections:/usr/share/ansible/collections"
    ANSIBLE_REMOTE_TMP: /var/tmp/ansible-remote
    ANSIBLE_ASYNC_DIR: "/tmp/.ansible_async"
    ANSIBLE_VERBOSITY: 3
  config_options:
    defaults:
      remote_tmp: /var/tmp/ansible-remote
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
