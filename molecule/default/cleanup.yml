---
- name: "Restore machine kernel sysctl values"
  hosts:
    - routing.osgiliath.test
  gather_facts: no
  # the first cleanup sequence position runs before create, when the container does not exist yet
  ignore_unreachable: true
  tasks:
    - name: "Read sysctl backup"
      ansible.builtin.slurp:
        src: /etc/molecule-sysctl-backup.conf
      register: sysctl_backup
      # the file is missing when prepare never ran or could not capture (e.g. an interrupted run); nothing to restore
      failed_when: false
      become: true
    - name: "Restore sysctl values captured before converge"
      ansible.builtin.command: sysctl -w {{ item }}
      # skips cleanly when the backup file is absent (default('') yields an empty loop);
      # __absent__ lines and empty-value lines (key=) from older backups are skipped
      loop: "{{ ((sysctl_backup.content | default('')) | b64decode).splitlines() | reject('contains', '__absent__') | select('match', '^[^=]+=.') | list }}"
      # best-effort: a failed restore (e.g. a global key from a non-host netns) must not block destroy
      failed_when: false
      become: true
    - name: "Remove sysctl backup file"
      ansible.builtin.file:
        path: /etc/molecule-sysctl-backup.conf
        state: absent
      failed_when: false
      become: true
